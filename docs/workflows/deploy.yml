name: Deploy to Cloudflare Pages

# 僅手動觸發。正式切換（Phase 5）前請先確認 Secrets 與 D1 / R2 已建立，
# 並已把 migrations/seed/seed.sql 匯入遠端 D1（見 AGENTS.md）。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Pages 部署分支名稱（非 main 為 Preview）
        default: preview
      apply_migrations:
        description: 部署前套用遠端 D1 migrations
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 注入 D1 database_id
        run: sed -i "s/00000000-0000-0000-0000-000000000000/${{ secrets.D1_DATABASE_ID }}/" wrangler.toml
      - if: ${{ inputs.apply_migrations }}
        run: npx wrangler d1 migrations apply yac-website-db --remote
      - run: npm run build
      - run: npx wrangler pages deploy dist --project-name=yac-website --branch=${{ inputs.branch }}
